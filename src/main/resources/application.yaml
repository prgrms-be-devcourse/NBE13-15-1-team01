spring:
  application:
    name: cafeSystem
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cafe_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        query:
          fail_on_pagination_over_collection_fetch: true
        default_batch_fetch_size: 100 # N+1 완화 : IN 절로 묶어서 한꺼번에 조회
  sql:
    init:
      #SpringBoot가 자동으로 optional:classpath*:schema.sql 경로에 schema 파일을 감지하여 자동으로 실행
      mode: always
  jackson:
    time-zone: Asia/Seoul
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE